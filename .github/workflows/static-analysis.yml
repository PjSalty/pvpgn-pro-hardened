# Supplementary static analysis: cppcheck + clang-tidy over the wire-facing code.
# Informational only (the enforcing SAST is CodeQL in codeql.yml, which annotates
# PRs with new findings). This job surfaces the legacy baseline in the log and
# never fails the build, so it stays honest instead of decorative-red.
name: static-analysis

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cppcheck clang-tidy cmake zlib1g-dev liblua5.1-0-dev build-essential

      - name: cppcheck (wire parsers)
        continue-on-error: true
        # scoped to the byte-level parsers in the threat model: the whole of
        # src/bnetd (handle_wol/handle_bnet are 60-230k lines) is too slow to be
        # a useful gate, and CodeQL already covers the full tree.
        run: |
          cppcheck --enable=warning,portability --inline-suppr --std=c++11 \
            --language=c++ -j"$(nproc)" -I src \
            src/common/packet.cpp src/common/tag.cpp src/common/bn_type.cpp \
            src/bnetd/handle_init.cpp 2>&1 | tee cppcheck.txt

      - name: clang-tidy (packet parsers, security checks)
        continue-on-error: true
        run: |
          cmake -S . -B build -D CMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -D CMAKE_POLICY_VERSION_MINIMUM=3.5 -D WITH_LUA=true >/dev/null
          clang-tidy -p build \
            src/common/packet.cpp src/common/tag.cpp src/common/bn_type.cpp \
            2>&1 | tee clang-tidy.txt
