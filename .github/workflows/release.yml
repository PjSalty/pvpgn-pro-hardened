# Build, sign, and attest the hardened image on a version tag.
# - reproducible multi-stage build (base pinned by digest, SOURCE_DATE_EPOCH)
# - SBOM (syft, SPDX 2.3 JSON)
# - keyless provenance + SBOM attestations (GitHub artifact attestations)
# - cosign keyless signature (for k8s admission engines that verify cosign)
# MR review is the only approval gate; the tag push is the trigger.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-sign-attest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write        # push image to GHCR
      id-token: write        # OIDC -> Fulcio (keyless signing + attestations)
      attestations: write    # GitHub attestation store
    steps:
      - uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - id: prep
        env:
          REPO: ${{ github.repository }}
        run: |
          echo "epoch=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"
          # GHCR requires a lowercase repository name.
          echo "IMAGE=ghcr.io/$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.prep.outputs.epoch }}
        with:
          context: .
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.prep.outputs.epoch }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          provenance: false     # the attestation below is the provenance; avoid the buildkit duplicate
          sbom: false
          outputs: type=image,push=true,rewrite-timestamp=true

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@8e94d75ddd33f69f691467e42275782e4bfefe84 # v0.20.9
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3.0.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'
      - name: Keyless sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
