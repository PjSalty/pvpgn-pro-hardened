# CodeQL static analysis for C/C++. Primary SAST gate: findings land in the
# repository's code-scanning view and annotate pull requests with new issues.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 4 * * 1"   # weekly, catches new query-pack findings

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # upload results to code scanning
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake zlib1g-dev liblua5.1-0-dev

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: c-cpp
          queries: security-and-quality

      - name: Build
        run: |
          cmake -S . -B build -D CMAKE_BUILD_TYPE=Release -D CMAKE_POLICY_VERSION_MINIMUM=3.5 -D WITH_LUA=true
          cmake --build build -j "$(nproc)"

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:c-cpp"
