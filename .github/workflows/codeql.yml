# CodeQL static analysis for C/C++. Primary SAST gate: findings land in the
# repository's code-scanning view and annotate pull requests with new issues.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 4 * * 1"   # weekly, catches new query-pack findings

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # upload results to code scanning
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake zlib1g-dev liblua5.1-0-dev

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: c-cpp
          queries: security-and-quality

      - name: Build
        run: |
          cmake -S . -B build -D CMAKE_BUILD_TYPE=Release -D CMAKE_POLICY_VERSION_MINIMUM=3.5 -D WITH_LUA=true
          cmake --build build -j "$(nproc)"

      # Analyze without uploading so the vendored nlohmann json header can be
      # dropped from the results before they reach code scanning.
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:c-cpp"
          upload: never
          output: sarif-results

      - name: Drop results in the vendored json header
        run: |
          python3 -I - sarif-results src/json/json.hpp <<'PY'
          import glob, json, os, sys
          from urllib.parse import unquote

          sarif_dir, vendored = sys.argv[1], sys.argv[2]
          workspace = os.environ.get("GITHUB_WORKSPACE", "").rstrip("/") + "/"


          def rel(uri):
              uri = unquote(uri)
              if uri.startswith("file://"):
                  uri = uri[len("file://"):]
              if workspace != "/" and uri.startswith(workspace):
                  uri = uri[len(workspace):]
              while uri.startswith("./"):
                  uri = uri[2:]
              return uri


          def primary(result):
              try:
                  return rel(result["locations"][0]["physicalLocation"]["artifactLocation"]["uri"])
              except (KeyError, IndexError, TypeError):
                  return None


          files = sorted(glob.glob(os.path.join(sarif_dir, "*.sarif")))
          if not files:
              sys.exit("no SARIF files in " + sarif_dir)
          for path in files:
              with open(path) as fh:
                  log = json.load(fh)
              kept = dropped = 0
              for run in log.get("runs", []):
                  results = run.get("results", [])
                  run["results"] = [r for r in results if primary(r) != vendored]
                  kept += len(run["results"])
                  dropped += len(results) - len(run["results"])
              with open(path, "w") as fh:
                  json.dump(log, fh)
              print(f"{path}: kept {kept}, dropped {dropped}")
          PY

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sarif-results
          category: "/language:c-cpp"
